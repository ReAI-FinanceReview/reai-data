# 크롤러 전역 설정
global:
  delay_between_requests: 2        # 요청 간 대기시간 (초)
  max_retries: 3                   # 최대 재시도 횟수
  timeout: 30                      # 요청 타임아웃 (초)

# App Store 크롤러 설정
appstore:
  country: "kr"                    # 국가 코드
  pages_to_crawl: 10               # 크롤링할 페이지 수
  max_reviews_per_app: 10          # 앱당 최대 리뷰 수
  # 아래 셋은 RSS 읽기(src/crawlers/appstore_rss.py)를 쓰는 AppStoreCrawler 와 app_version 백필이 함께 읽고, 코드 기본값은 없음
  # 고객 리뷰 RSS(최신순, 쪽 단위)
  reviews_rss_url: "https://itunes.apple.com/{country}/rss/customerreviews/page={page}/id={app_id}/sortby=mostRecent/json"
  rss_page_size: 50                # RSS 한 쪽의 리뷰 수. 덜 찬 쪽 뒤가 모두 비면 피드의 정상 끝으로 봄
  # 리뷰를 하나도 못 읽은 앱이 연달아 이 수에 닿으면 RSS 장애로 보고 남은 App Store 앱은 조회하지 않음.
  # 크롤은 빈 피드와 첫 리뷰 전에 실패한 요청을 세고 그 스토어 단계를 실패로 끝냄. 백필은 빈 피드만 셈
  max_consecutive_empty_feeds: 3
  
# Play Store 크롤러 설정
playstore:
  language: "ko"                   # 언어 코드
  country: "kr"                    # 국가 코드
  reviews_per_app: 10              # 앱당 리뷰 수 (테스트용)
  sort_order: "newest"             # 정렬 순서
  # 아래 넷은 리뷰 클라이언트(src/crawlers/playstore_reviews.py)를 쓰는 PlayStoreCrawler 와 app_version 백필이 함께 읽고, 코드 기본값은 없음.
  # 요청 timeout 은 global.timeout 을 따름
  reviews_url: "https://play.google.com/_/PlayStoreUi/data/batchexecute?hl={language}&gl={country}"  # 리뷰 조회 batchexecute 엔드포인트
  reviews_rpc_id: "oCPfdb"         # 리뷰 목록 RPC id (f.req 본문에 들어감)
  max_retries: 2                   # 일시 오류(연결, 본문 도중 끊김, timeout, HTTP 429/5xx, payload 없는 PlayGatewayError) 때 첫 요청 뒤 재시도 횟수. TLS 실패는 재시도하지 않음
  retry_backoff_seconds: 5         # n번째 재시도 전 n × 이 값(초)만큼 대기
  # 평소 수집(PlayStoreCrawler) 전용이고 코드 기본값은 없음
  page_size: 200                   # 요청 1회에 받는 최대 리뷰 수. reviews_per_app 이 더 크면 continuation token 으로 나눠 받음
  # app_version 백필(scripts/backfill_app_version.py) 전용. 평소 수집에는 쓰지 않고 코드 기본값도 없음
  backfill_page_size: 200          # 요청 1회(continuation token 1쪽)에 받는 리뷰 수
  backfill_max_reviews_per_app: 3000  # 앱당 조회 상한. 조회한 리뷰 수가 이 값에 닿으면 cap_reached 로 멈춤

# 출력 설정
output:
  enabled: true                   # 출력 활성화 여부
  base_directory: "data/raw"      # 기본 출력 디렉토리
  file_format: "csv"              # 파일 형식
  encoding: "utf-8-sig"           # 인코딩
  date_format: "%Y%m%d"           # 날짜 형식

# 앱 ID 파일 경로
app_ids:
  appstore: "config/app_ids/appstore_app_ids.txt"
  playstore: "config/app_ids/playstore_app_ids.txt"
  excluded: "config/app_ids/excluded_apps.txt"